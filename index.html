<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta
      name="description"
      content="Re:Fill - 필요하기 전에, 먼저 채우다. 생활 소비를 예측하는 AI 플랫폼."
    />
    <title>Re:Fill</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('refill_theme');
          var isDark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          }
        } catch (error) {
          // localStorage 접근 불가 시 라이트 모드로 폴백한다.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
